name: Bug report
description: Something in ClawMuse does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems do **not** go here: report them privately as described in [SECURITY.md](https://github.com/PSA-Team-source/clawmuse/blob/main/SECURITY.md).

        Remove API keys, tokens and personal data from everything you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClawMuse version
      description: Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS, Apple silicon
        - macOS, Intel
        - Windows, x64
        - Windows, ARM64
        - Built from source (say which OS below)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 26.0 / Windows 11 24H2
  - type: input
    id: model
    attributes:
      label: Model provider
      description: Which model the assistant uses (for example Claude Code, OpenRouter, Ollama). Not the key.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        App log: `~/Library/Logs/ClawMuse/main.log` (macOS) or `%APPDATA%\ClawMuse\logs\main.log` (Windows).
        Gateway log: command palette → Open runtime log. Paste only the relevant lines.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images here.
